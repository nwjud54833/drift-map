name: DriftMap public Order API demo

on:
  pull_request:
    branches: [main]
    paths:
      - "examples/demo/order-api/v2.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove the prior bot report so the pinned Action recreates the sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GH_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- driftmap-contract-review -->"))) | .id' |
            while IFS= read -r comment_id; do
              [ -z "$comment_id" ] || gh api --method DELETE "repos/$GH_REPOSITORY/issues/comments/$comment_id"
            done
      - name: Post the DriftMap sticky review comment
        id: review
        continue-on-error: true
        uses: nwjud54833/drift-map@v2.5.7
        with:
          baseline-path: examples/demo/order-api/v1.json
          candidate-path: examples/demo/order-api/v2.json
          fail-on: breaking
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the local CLI used by the report assertion
        run: |
          npm ci --prefix packages/driftmap
          npm run build --prefix packages/driftmap
      - name: Verify the demo contains a breaking Order API finding
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          test "$REVIEW_OUTCOME" = failure
          set +e
          node packages/driftmap/dist/cli.js diff \
            examples/demo/order-api/v1.json \
            examples/demo/order-api/v2.json \
            --fail-on breaking --format markdown > "$RUNNER_TEMP/order-api-report.md"
          result=$?
          set -e
          test "$result" -eq 1
          grep -F '| BREAKING |' "$RUNNER_TEMP/order-api-report.md"
          grep -F '/customer/email' "$RUNNER_TEMP/order-api-report.md"
          grep -F 'Inspect full diff in DriftMap Workbench' "$RUNNER_TEMP/order-api-report.md"
