name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # Placeholders only: `next build` imports the Prisma client and auth
          # configuration at build time. Nothing connects to a database during
          # the build, and the hermetic test suite needs no environment.
          DATABASE_URL: postgresql://ci-placeholder:ci-placeholder@127.0.0.1:5432/placeholder
          AUTH_SECRET: ci-placeholder-not-a-real-secret

  secret-scan:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Scan full history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
