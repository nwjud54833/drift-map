openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    get:
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
components:
  schemas:
    Order:
      type: object
      required:
        - orderId
        - total
      properties:
        orderId:
          type: string
        total:
          type: number
    Customer:
      type: object
      properties:
        id:
          type: string
